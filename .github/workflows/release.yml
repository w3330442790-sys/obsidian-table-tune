name: Verify plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check main.js
      - name: Check manifest version
        run: node -e "const m=require('./manifest.json'),p=require('./package.json'),v=require('./versions.json');if(m.version!==p.version||v[m.version]!==m.minAppVersion)process.exit(1)"
